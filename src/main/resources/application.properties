spring.application.name=cultureshelf
server.port=8090

# --- Base de donnees (dev local : H2 fichier dans ./data, voir application-postgres.properties pour docker)
spring.datasource.url=jdbc:h2:file:./data/cultureshelf;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Upload des visuels
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- CultureShelf
# Liste des fronts autorises (separes par des virgules)
cultureshelf.cors.allowed-origins=http://localhost:4200
cultureshelf.storage.path=./data/uploads

# --- Fournisseur de catalogue MangaDex
cultureshelf.providers.mangadex.enabled=true
cultureshelf.providers.mangadex.base-url=https://api.mangadex.org
cultureshelf.providers.mangadex.covers-url=https://uploads.mangadex.org/covers
# Ordre de preference des langues pour les titres et les couvertures
cultureshelf.providers.mangadex.preferred-locales=fr,en,ja
cultureshelf.providers.mangadex.user-agent=CultureShelf/0.1
