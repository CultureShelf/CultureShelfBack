services:
  java-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: CultureShelf-backend
    restart: unless-stopped
    init: true
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/cultureshelf
      DB_USER: cultureshelf
      DB_PASSWORD: cultureshelf
      # Fronts autorises, separes par des virgules
      CULTURESHELF_CORS_ALLOWED_ORIGINS: http://localhost:4200
      CULTURESHELF_STORAGE_PATH: /app/data/uploads
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cultureshelf
      POSTGRES_PASSWORD: cultureshelf
      POSTGRES_DB: cultureshelf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cultureshelf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
